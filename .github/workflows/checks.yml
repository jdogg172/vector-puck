name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan public boundaries
        run: python3 scripts/scan_public.py
      - name: Check shell scripts
        run: bash -n scripts/prepare_puck.sh scripts/install_puck.sh
      - name: Build controller image
        run: docker build -t vector-puck:ci .
      - name: Test image without network or API credentials
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=64m
          --cap-drop ALL --security-opt no-new-privileges:true
          -v "$PWD:/repo:ro" -w /repo --entrypoint python
          vector-puck:ci -m unittest discover -s tests -p 'test_*.py' -v
